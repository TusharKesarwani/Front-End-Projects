<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contributor Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Contributor Dashboard</h1>

  <div id="contributors-list"></div>

  <h2>Add New Contributor</h2>
  <form id="contributor-form">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="text" id="role" placeholder="Role" required>
    <input type="text" id="github" placeholder="GitHub Profile URL" required>
    <button type="submit">Add Contributor</button>
  </form>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
